<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>경사각에 따른 물질 이동과 에너지 전달</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <p class="eyebrow">Interactive Science Simulation</p>
        <h1>경사각에 따른 물질 이동과 에너지 전달</h1>
        <p>
          
        </p>
      </header>

      <section class="layout">
        <aside class="panel control-panel" aria-label="조작 패널">
          <h2></h2>

          
          <div class="slider-group">
            <div class="slider-label">
              <label for="angleSlider">경사각</label>
              <strong><span id="angleValue">30</span>도</strong>
            </div>
            <input id="angleSlider" type="range" min="0" max="60" value="30" />
          </div>

          <div class="slider-group">
            <div class="slider-label">
              <label for="frictionSlider">마찰계수</label>
              <strong><span id="frictionValue">0.20</span></strong>
            </div>
            <input
              id="frictionSlider"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0.20"
            />
          </div>

          <div class="button-row">
            <button id="startButton" type="button">시작</button>
            <button id="resetButton" class="secondary" type="button">초기화</button>
          </div>

          <div class="mini-note">
            <span></span>
            경사각이 커질수록 중력의 경사 방향 성분이 커지고, 마찰이 커질수록
            이동 속도와 전달 에너지가 감소합니다.
          </div>
        </aside>

        <section class="panel simulation-panel" aria-label="시뮬레이션 영역">
          <div class="panel-heading">
            <h2>시뮬레이션 영역</h2>
            <p id="stateText">대기 중</p>
          </div>
          <div class="canvas-shell">
            <canvas id="simulationCanvas" width="900" height="520">
              이 브라우저는 canvas를 지원하지 않습니다.
            </canvas>
          </div>
        </section>

        <aside class="panel result-panel" aria-label="결과 패널">
          <h2>실시간 결과</h2>

          <div class="metric-grid">
            <article class="metric">
              <span>현재 경사각</span>
              <strong><span id="resultAngle">30</span>도</strong>
            </article>
            <article class="metric">
              <span>현재 속도</span>
              <strong><span id="resultSpeed">0.00</span> m/s</strong>
            </article>
            <article class="metric">
              <span>이동 거리</span>
              <strong><span id="resultDistance">0.00</span> m</strong>
            </article>
            <article class="metric">
              <span>상대적 운동에너지</span>
              <strong><span id="resultEnergy">0.00</span></strong>
            </article>
          </div>

          <div class="interpretation" id="interpretationText">
            시작 버튼을 누르면 물체가 경사면을 따라 이동합니다.
          </div>
        </aside>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
